services:
  db:
    image: postgres:16
    container_name: careerhub_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: CareerHub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CareerHub"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - careerhub_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=CareerHub;Username=postgres;Password=password123;
      - Jwt__SecretKey=${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  careerhub_data: