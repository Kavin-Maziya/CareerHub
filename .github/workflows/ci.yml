name: CareerHub API Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Execute Complete Verification Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK Run Environment
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.0'

    - name: Restore Application Dependencies
      run: dotnet restore

    - name: Build Solution Binaries
      run: dotnet build --no-restore --configuration Release

    - name: Run Verification Suite (Unit, Integration & Repository)
      run: dotnet test --no-build --configuration Release --verbosity normal